# ===================================
# Feature Module Configuration
# 功能模块开关配置
# ===================================
# Set to true to enable, false to disable

# Blog core module (always enabled)
# 博客基础功能（始终启用）
module.blog.enabled=true

# Comment system module
# 评论系统模块
module.comment.enabled=true

# Category and tag (integrated in BlogEntity)
# 分类和标签（已集成到 BlogEntity）
module.category.enabled=true
module.tag.enabled=true

# Search module (COMPLETED)
# 搜索模块（已完成）
module.search.enabled=true

# File upload module (COMPLETED)
# 文件上传模块（已完成）
module.upload.enabled=true

# Archive and timeline module (COMPLETED)
# 归档和时间线模块（已完成）
module.archive.enabled=true

# User authentication module (COMPLETED)
# 用户认证模块（已完成）
module.user.enabled=true
module.auth.enabled=true

# Statistics module (COMPLETED)
# 访问统计模块（已完成）
module.statistics.enabled=true
