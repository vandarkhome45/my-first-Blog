# ===================================
# Database Configuration
# 数据库配置
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# spring.datasource.password 已移至 application-secret.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port
server.port=8081

# Import secret configuration file (copy from application-secret.example.properties)
spring.config.import=optional:classpath:application-secret.properties

# ===================================
# File Upload Configuration
# 文件上传配置
# ===================================

# Max file size (10MB)
# 单个文件最大大小
spring.servlet.multipart.max-file-size=10MB

# Max request size (50MB)
# 请求最大大小（批量上传时）
spring.servlet.multipart.max-request-size=50MB

# Upload file path
# 文件上传路径
upload.path=./uploads/

# ===================================
# JWT Configuration
# JWT 认证配置
# ===================================

# JWT secret key - 已移至 application-secret.properties
# JWT expiration time in milliseconds (default: 7 days = 604800000ms)
# Token 过期时间（默认 7 天）
jwt.expiration=604800000
