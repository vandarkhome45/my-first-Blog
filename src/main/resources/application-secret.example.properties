# ============================================
# 敏感配置模板文件
# 使用方法：
#   1. 复制此文件并重命名为 application-secret.properties
#   2. 将下面各个配置项替换为你的真实值
#   3. application-secret.properties 已在 .gitignore 中，不会被提交
# ============================================

# 数据库密码（必填）
spring.datasource.password=your_db_password_here

# JWT 签名密钥（必填，至少 32 个字符）
jwt.secret=your_jwt_secret_key_at_least_32_characters_here
